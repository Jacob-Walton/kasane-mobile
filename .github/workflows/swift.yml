name: swift

# The Windows loop builds KasaneKit and runs its tests; SwiftUI does not exist off Apple platforms,
# so this is where KasaneUI gets compiled and drawn. The snapshots are the point of the job: they
# come back as an artifact, which is the only way to see a SwiftUI screen from a PC.

on:
  push:
    paths:
      - 'swift/**'
      - 'tokens/**'
      - '.github/workflows/swift.yml'
  workflow_dispatch:

jobs:
  mac:
    runs-on: macos-15
    defaults:
      run:
        working-directory: swift

    steps:
      - uses: actions/checkout@v4

      - name: toolchain
        run: swift --version && xcodebuild -version

      - name: draw every screen
        env:
          SNAPSHOT_DIR: ${{ github.workspace }}/snapshots
        run: swift test

      - name: build for ios
        run: |
          xcodebuild build \
            -scheme KasaneUI \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/ios" \
            -quiet

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: snapshots
          path: snapshots/*.png
          if-no-files-found: error
